name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: natillera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/natillera
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/natillera
      BETTER_AUTH_SECRET: ci-secret-de-pruebas-con-mas-de-32-caracteres
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y formato
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test

      - name: Migrar base de datos
        run: npm run db:migrate

      - name: Sembrar datos demo
        run: npm run db:seed

      - name: Build de producción
        run: npm run build
